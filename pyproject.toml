[project]
name = "beril-wiki"
version = "0.1.0"
description = "Compiler + pipeline for the BERIL knowledge wiki"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk==0.1.81",
    "litellm>=1.40",
    # SDK 0.1.81 requires the MCP 1.x in-process list_tools interface.
    "mcp>=1.0,<2",
    "networkx>=3.2",
    "openai-codex==0.159.3",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",  # starlette's TestClient, for tests/test_serve.py
    "pytest>=8",
    "ruff>=0.12",
    "ty",
]
# The site server, and all the container image installs (beril_wiki.serve).
# Pinned to the versions mcp already locks, so the image and `uv sync` agree.
serve = [
    "starlette==1.6.0",
    "uvicorn==0.52.4",
]

[tool.uv]
default-groups = ["dev", "serve"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
