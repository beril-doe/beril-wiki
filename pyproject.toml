[project]
name = "beril-wiki"
version = "0.1.0"
description = "Compiler + pipeline for the BERIL knowledge wiki"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.40",
    "networkx>=3.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
    "ty",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
