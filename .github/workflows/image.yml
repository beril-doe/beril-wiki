name: Build wiki image

# The site as served on SPIN, at beril.kbase.us/wiki (and beril-dev.kbase.us/wiki),
# by the server in src/beril_wiki/serve.py. Same render and gates as pages.yml,
# built once per host because Quartz bakes the host into absolute links (the
# footer's About link, the sitemap, RSS); in-page links follow the /wiki path.
# The site is built here on the runner, not in the Dockerfile, because the
# search vectors come from the search-data branch and need the checkout's .git.
#
# This only publishes images. SPIN picks a new one up when the deployment is
# restarted (it pulls :latest / :develop); nothing here touches the cluster.
on:
  push:
    branches: [main]
    paths: &build_paths
      - "wiki/**"
      - "src/**"
      - "scripts/**"
      - "theme/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/image.yml"
  # Build both images on the PR too, without pushing.
  pull_request:
    paths: *build_paths
  # Also dispatched by `search_data push` (beril_wiki.publish.search_data).
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Pinned rather than derived from the repository, so a repo transfer cannot
  # move the image out from under the SPIN deployments.
  IMAGE_NAME: beril-doe/beril-wiki

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: beril.kbase.us
            tag: latest
          - host: beril-dev.kbase.us
            tag: develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Validate the corpus
        run: uv run --project . python -m beril_wiki.check --strict

      - name: Build site
        env:
          WIKI_BASE_URL: ${{ matrix.host }}/wiki
          SEARCH_REQUIRE_VECTORS: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: scripts/build_quartz.sh

      # As in pages.yml: build_quartz.sh compiles the theme but never
      # type-checks it, and an image must not ship a theme Pages would reject.
      - name: Type-check the theme
        run: npm --prefix theme run typecheck

      - name: Check the built site
        run: scripts/check_site.sh

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.tag }}
            type=sha,prefix=${{ matrix.tag }}-

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
