name: Build curator image

# The scheduled curator (Dockerfile.curator, deploy/README.md): dependencies,
# Node, the Claude and Codex CLIs and a Quartz clone, with no site and no wiki
# code inside; the job runs the clone on its persistent volume. Same channel
# logic as image.yml, so the dev CronJobs pull :develop and production :latest:
#
#   pull request      -> :develop
#   push to main      -> :latest
#   workflow_dispatch -> whichever the `channel` input names (default :latest)
#
# Only main may produce :latest. No deploy step: a CronJob pulls the tag at its
# next start (imagePullPolicy: Always), so nothing needs restarting. A fork's
# pull request builds as a check and pushes nothing.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile.curator
      - deploy/curate.sh
      - pyproject.toml
      - uv.lock
      - theme/package.json
      - theme/package-lock.json
      - scripts/build_quartz.sh
      - .github/workflows/curator-image.yml
  pull_request:
    paths:
      - Dockerfile.curator
      - deploy/curate.sh
      - pyproject.toml
      - uv.lock
      - theme/package.json
      - theme/package-lock.json
      - scripts/build_quartz.sh
      - .github/workflows/curator-image.yml
  workflow_dispatch:
    inputs:
      channel:
        description: Image tag to build and push
        type: choice
        options: [latest, develop]
        default: latest

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: beril-doe/beril-wiki-curator
  CHANNEL: ${{ github.event_name == 'pull_request' && 'develop' || inputs.channel || 'latest' }}
  PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    concurrency:
      group: curator-image-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'develop' || inputs.channel || 'latest' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Refuse :latest from any ref but main
        run: |
          if [ "$CHANNEL" = latest ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "refusing to build :latest from $GITHUB_REF; only main may" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.CHANNEL }}
            type=sha,prefix=${{ env.CHANNEL }}-

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.curator
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=curator-${{ env.CHANNEL }}
          cache-to: type=gha,mode=max,scope=curator-${{ env.CHANNEL }}
