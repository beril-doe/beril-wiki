name: Publish wiki

# Render-only: wiki/ and every figure are committed, so this needs no CBORG
# key and no observatory checkout. Refreshing the *content* is still a
# maintainer running scripts/run_pipeline.sh and committing the result; this
# job only turns what is committed into the published site. The meaning-search
# vectors come from the search-data branch (beril_wiki.publish.search_data);
# pushing new ones there dispatches this workflow on main.
on:
  push:
    branches: [main]
    paths: &build_paths
      - "wiki/**"
      - "src/**"
      - "scripts/**"
      - "theme/**"
      - "state/lakehouse/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  # Build on the PR too, without deploying. Everything here is untested on
  # Linux otherwise: the figure downscale falls back when `sips` is absent,
  # the provenance check runs under GNU rather than BSD grep, and the Quartz
  # clone and npm install happen for real instead of reusing a local checkout.
  # Finding that out on the first push to main means finding it out with the
  # repository already public and no site.
  pull_request:
    paths: *build_paths
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never publish two builds at once; let a newer push win the queue.
# Per-ref, so a PR build never cancels a deploy of main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The About page tells readers these checks run on every build and block
      # publication. That has to be true of the deploy too, not just of a
      # maintainer's local pipeline run: wiki/ is a set of committed
      # files, so a direct push can carry an unknown [src:] id, a number in no
      # cited source, or a dead link straight to the site. wiki_check is
      # stdlib-only and reads the committed wiki/sources/, so it needs no key
      # and no observatory checkout.
      - name: Validate the corpus
        run: uv run --project . python -m beril_wiki.check --strict

      # A pull request must bring the vectors for the sections it changes (pushed
      # to search-data before review), so pages never change without them. A
      # deploy only warns: holding back content for a missing vector is worse.
      - name: Build site
        env:
          WIKI_BASE_URL: beril-doe.org/beril-wiki
          SEARCH_REQUIRE_VECTORS: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: scripts/build_quartz.sh

      # The theme is compiled by build_quartz.sh but never type-checked by it;
      # a map or frame change that breaks the types would still render.
      - name: Type-check the theme
        run: npm --prefix theme run typecheck

      # Page count, the about page, and the provenance callout on every page;
      # shared with the SPIN image build (image.yml), so both publish the same.
      - name: Check the built site
        run: scripts/check_site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
