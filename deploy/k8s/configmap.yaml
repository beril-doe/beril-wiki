# Non-secret settings shared by the plan and curate CronJobs and the run-now Job.
# Dev values; production changes the hosts (beril.kbase.us) and the budgets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: beril-wiki-curator
  namespace: knowledge-engine
  labels:
    app: beril-wiki-curator
data:
  # `corpus pull-hub` fills corpus/ from BERIL's context API with BERIL_TOKEN and
  # nothing else; the run then reads corpus/ (FETCH_BACKEND stays local).
  BERIL_URL: "https://beril-dev.kbase.us"
  # Unattended: API keys from the Secret; OAuth and provider routing stripped.
  BERIL_WIKI_AUTH: "api"
  # The git clone on the volume, and the ref whose code paths each run refreshes.
  WIKI_WORKDIR: "/work/beril-wiki"
  WIKI_GIT_URL: "https://github.com/beril-doe/beril-wiki.git"
  WIKI_GIT_REF: "main"
  # Baked into the site's absolute URLs (sitemap, RSS, canonical).
  WIKI_BASE_URL: "beril-dev.kbase.us/wiki"
  # The wiki pod's store routes and reload, over the cluster network, through
  # the Service the observatory's SPIN guide names `beril-wiki` (the Compose
  # stack calls the same container `wiki`; a publish to an unknown host fails
  # after the night's curation, so check `kubectl -n knowledge-engine get svc`).
  # The pod itself runs with WIKI_ARTIFACT_ENDPOINT=file:///srv/artifacts/store.
  WIKI_ARTIFACT_ENDPOINT: "http://beril-wiki:8080/wiki/_admin/store"
  WIKI_ARTIFACT_PREFIX: "wiki"
  WIKI_RELOAD_URL: "http://beril-wiki:8080/wiki/_admin/reload"
  # Budgets per curate run (docs/agentic-workflow.md, "Commands and limits").
  # Fixed, so a bad night is capped; raise deliberately after measuring a run.
  WIKI_CURATE_MAX_TOKENS: "2000000"
  WIKI_CURATE_MAX_JOBS: "120"
  WIKI_CURATE_WORKERS: "4"
  # Per job-step prefix, counted across runs. A name must be a prefix a run's
  # jobs carry (extract plan write lit figures curator merge merge-judge
  # backmerge repair) or an editorial stage (conflicts topics authors headlines
  # novelty directions gists links shared outcomes followups); model roles such
  # as `pages` are refused, and curate.sh checks the list at every start.
  # Starting points, not measurements.
  WIKI_CURATE_STAGE_MAX_USD: "extract=20 plan=10 write=40 lit=15 merge=10 figures=5 repair=10"
  WIKI_CURATE_EXTRA_ARGS: ""
  # Git identity for the history commits.
  WIKI_GIT_NAME: "BERIL wiki curator"
  WIKI_GIT_EMAIL: "beril-wiki-curator@kbase.us"
