# The curator's working volume: one git clone of beril-wiki at /work/beril-wiki
# holding code and the trees the curator owns (wiki/, state/, corpus/, search/,
# .agentic/). Populate it once (deploy/README.md, "First-time population");
# after that only the jobs write to it.
#
# Size: the clone with history is about 1.5 GB (figures under corpus/ and
# wiki/figures/ dominate), .agentic/ grows with the ledger, transcripts and
# evidence (a few hundred MB after months), theme/node_modules about 50 MB,
# and quartz/ (the Quartz clone copied from the image, its node_modules and
# the rendered public/) about 1 GB. 10Gi leaves room.
#
# RWO: both CronJobs run on the node the volume binds to, and curate.sh holds
# /work/.curate.lock so the hourly plan never works the clone while the nightly
# run does (Forbid is per CronJob). Namespace: dev is knowledge-engine.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: beril-wiki-curator-work
  namespace: knowledge-engine
  labels:
    app: beril-wiki-curator
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
  # storageClassName: nfs-client   # SPIN's default applies when omitted
