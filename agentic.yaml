# Versioned model IDs keep paid caches tied to a specific model release.
# Scientific work gets Opus 5.5; bounded selection tasks get Sonnet 5.
# Budgets remain explicit run flags, never implicit permission to spend.
# Every role below is pinned; model is only the fallback for omitted roles.
model: claude-opus-5-5
step_models:
  extraction: claude-opus-5-5
  planning: claude-opus-5-5
  writing: claude-opus-5-5
  review: claude-opus-5-5
  queries: claude-sonnet-5
  figures: claude-sonnet-5
