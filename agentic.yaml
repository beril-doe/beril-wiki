# Versioned model IDs keep paid caches tied to a specific model release.
# A model named gpt-* runs on the Codex app server; claude-* on the Claude SDK.
# Hybrid policy (Oct 2026): Claude plans and writes, GPT extracts and reviews, so
# every page is checked by a model family that did not write it.
# Budgets remain explicit run flags, never implicit permission to spend.
# Every role below is pinned; model is only the fallback for omitted roles.
# Roles apply to work done from now on; accepted pages stay as they were written.
# Chosen by the Oct 2026 model-mix and extraction pilots (docs/agentic-workflow.md#pilots):
# Haiku planning misrouted a third of records, and Luna or Haiku extraction lost coverage.
model: claude-opus-5-5
step_models:
  extraction: gpt-6.1-sol
  planning: claude-sonnet-5-5
  pages: claude-haiku-5-5
  writing: claude-sonnet-5-5
  review: gpt-6-luna
  queries: gpt-6.1-sol
  figures: gpt-6.1-sol
  # Finding cards, literature labels and research directions (stages headlines,
  # novelty, directions). Their reviews, queries and the cross-vendor label check run on
  # the review roles below and queries, so a GPT model checks every card a Claude model
  # writes.
  cards: claude-sonnet-5-5
  # Reviews of the stages directions, gists, links, shared, outcomes and followups.
  # The model is part of every card record's key, so these pins match the models that
  # judged the accepted records; changing one re-asks every record of the stages that
  # use it.
  card_review: gpt-6-luna
  # Reviews of the stages headlines and novelty, and novelty's second opinion.
  findings_review: gpt-6.1-sol
  # The one-label stages outcomes and followups (result type, follow-up need).
  labels: claude-haiku-5-5
step_efforts:
  planning: high
  pages: medium
  writing: medium
  review: high
